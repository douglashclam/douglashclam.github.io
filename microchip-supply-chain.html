<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microchip Supply Chain — Douglas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<style>
:root {
  --color-background-primary: #ffffff;
  --color-background-secondary: #f5f5f2;
  --color-background-danger: #FCEBEB;
  --color-background-warning: #FEF3E2;
  --color-background-success: #E1F5EE;
  --color-text-primary: #1a1a1a;
  --color-text-secondary: #6b6b6b;
  --color-text-tertiary: #a0a09a;
  --color-text-danger: #791F1F;
  --color-text-warning: #633806;
  --color-text-success: #085041;
  --color-border-primary: #d0d0ca;
  --color-border-secondary: #e0e0da;
  --color-border-tertiary: #eaeae4;
  --border-radius-lg: 12px;
  --border-radius-md: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #eeeee8; min-height: 100vh; color: var(--color-text-primary); }
.kg-wrap { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 3rem; }
nav { display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem }
nav a { display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;color:var(--color-text-tertiary);text-decoration:none;transition:color 0.15s }
nav a:hover { color:var(--color-text-primary) }
nav h1 { font-size:13px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-text-tertiary) }
.kg-panel { background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.07);padding:1.5rem }

/* Component styles */
.sb{display:grid;grid-template-columns:190px 1fr;gap:14px;align-items:start;padding:4px 0}
.si{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;border:0.5px solid transparent;cursor:pointer;transition:background .12s,border-color .12s;margin-bottom:3px}
.si:hover{background:var(--color-background-secondary)}
.si.active{background:var(--color-background-secondary);border-color:var(--color-border-secondary)}
.snum{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;flex-shrink:0}
.sname{font-size:12px;font-weight:500;color:var(--color-text-primary);line-height:1.2}
.ssub{font-size:10px;color:var(--color-text-secondary)}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-left:auto}
/* Critical dot — larger + persistent glow ring */
.sdot-critical{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-left:auto;box-shadow:0 0 0 2.5px rgba(216,90,48,0.22);animation:critpulse 2s ease-in-out infinite}
@keyframes critpulse{0%,100%{box-shadow:0 0 0 2px rgba(216,90,48,0.18)}50%{box-shadow:0 0 0 4px rgba(216,90,48,0.34)}}
.dp{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}
.dph{padding:12px 16px 10px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;gap:12px;align-items:flex-start}
.ill{width:110px;height:90px;flex-shrink:0;border-radius:8px;overflow:hidden;background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:center}
.dpb{padding:12px 16px}
.rbadge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 6px;border-radius:6px;font-size:11px;font-weight:500;margin-top:5px}
.desc{font-size:12px;color:var(--color-text-secondary);line-height:1.55;margin:6px 0 0}
.sec{font-size:11px;font-weight:500;color:var(--color-text-secondary);margin-bottom:8px}
.cr{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.cr:last-child{border-bottom:none}
.cn{font-size:12px;font-weight:500;color:var(--color-text-primary)}
.crole{font-size:11px;color:var(--color-text-secondary);line-height:1.3;margin-top:1px}
.ctag{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--color-background-secondary);color:var(--color-text-secondary);flex-shrink:0}
.grow{margin-bottom:5px}
.gbar{height:5px;border-radius:3px;overflow:hidden;background:var(--color-background-secondary);margin-top:2px}
.gfill{height:100%;border-radius:3px;transition:width .35s ease}
.glabel{display:flex;justify-content:space-between;font-size:11px;color:var(--color-text-secondary)}
.bnote{margin-top:12px;padding:9px 12px;border-radius:8px;border-left:2px solid;font-size:11px;line-height:1.55}
.stacked{height:7px;border-radius:4px;overflow:hidden;display:flex;margin:0 0 8px}
.stacked div{transition:width .35s ease}
.legrow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.legitem{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--color-text-secondary)}
.legdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.tog-wrap{display:flex;background:var(--color-background-secondary);border-radius:8px;padding:3px;width:fit-content;margin-bottom:12px}
.tog-btn{padding:5px 13px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--color-text-secondary);transition:all .15s;font-family:'Inter',sans-serif}
.tog-btn.active{background:var(--color-background-primary);color:var(--color-text-primary);border:0.5px solid var(--color-border-tertiary)}
.chg{display:inline-block;font-size:10px;font-weight:500;padding:1px 5px;border-radius:4px;margin-left:4px;vertical-align:middle}
</style>

<div class="kg-wrap">
  <nav>
    <a href="area.html?id=geopolitics"><i class="ti ti-arrow-left"></i> Geopolitics</a>
    <h1>Microchip Supply Chain</h1>
    <span></span>
  </nav>

  <div class="kg-panel">
    <h2 style="font-size:16px;font-weight:600;margin-bottom:4px">Microchip fabrication pipeline</h2>
    <p style="font-size:13px;color:var(--color-text-secondary);margin-bottom:1.25rem">10-step production process — illustrations, key companies, and geographic bottlenecks. Toggle by chip type.</p>

    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px">
      <div class="tog-wrap">
        <button class="tog-btn active" onclick="setMode('all',this)">All nodes</button>
        <button class="tog-btn" onclick="setMode('adv',this)">Advanced ≤5nm</button>
        <button class="tog-btn" onclick="setMode('mat',this)">Mature ≥28nm</button>
      </div>
      <div id="mode-note" style="font-size:11px;color:var(--color-text-secondary)">Overall market share by revenue</div>
    </div>

    <div class="sb">
      <div>
        <div style="font-size:11px;font-weight:500;color:var(--color-text-secondary);margin-bottom:7px">Production pipeline</div>
        <div id="step-list"></div>
      </div>
      <div id="detail-panel" class="dp"></div>
    </div>

    <div style="margin-top:10px;display:flex;gap:14px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--color-text-secondary)"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#D85A30;box-shadow:0 0 0 2.5px rgba(216,90,48,0.25)"></span>Critical bottleneck</div>
      <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--color-text-secondary)"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#EF9F27"></span>Moderate risk</div>
      <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--color-text-secondary)"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#1D9E75"></span>Stable supply</div>
    </div>
  </div>
</div>

function svgTest(){return`<svg viewBox="0 0 110 90" xmlns="http://www.w3.org/2000/svg" width="110" height="90"><rect x="25" y="12" width="60" height="48" rx="4" fill="#f0e8d8" stroke="#a89070" stroke-width="1"/><rect x="32" y="18" width="46" height="30" rx="2" fill="#e0d8c8" stroke="#b0a080" stroke-width="0.5"/><rect x="38" y="24" width="16" height="12" rx="1" fill="#a8c0a8" stroke="#7090a0" stroke-width="0.5"/><rect x="58" y="24" width="14" height="12" rx="1" fill="#c0a8a8" stroke="#a07070" stroke-width="0.5"/><rect x="38" y="38" width="34" height="8" rx="1" fill="#d0c8b8" stroke="#a09080" stroke-width="0.3"/><line x1="55" y1="60" x2="55" y2="68" stroke="#a89070" stroke-width="1.5"/><line x1="40" y1="68" x2="70" y2="68" stroke="#a89070" stroke-width="1.5"/><line x1="43" y1="68" x2="38" y2="75" stroke="#a89070" stroke-width="1.5"/><line x1="55" y1="68" x2="55" y2="75" stroke="#a89070" stroke-width="1.5"/><line x1="67" y1="68" x2="72" y2="75" stroke="#a89070" stroke-width="1.5"/><circle cx="38" cy="76" r="2.5" fill="#d85030"/><circle cx="55" cy="76" r="2.5" fill="#d85030"/><circle cx="72" cy="76" r="2.5" fill="#3090a0"/><text x="55" y="88" text-anchor="middle" font-size="8" fill="#888780" font-family="sans-serif">Automated test equipment</text></svg>`;}

const ILLS=[svgWafer,svgPhotoresist,svgEUV,svgEtch,svgCVD,svgIon,svgMetro,svgFab,svgPkg,svgTest];

const steps=[
{name:"Silicon wafers",sub:"Raw material",risk:"moderate",rl:"Geographic concentration",desc:"Sand (SiO₂) refined to 99.9999999% pure silicon. Ingots grown by Czochralski method — a seed crystal is slowly pulled from molten silicon — then sliced and polished to mirror smoothness. The iridescent rainbow on a wafer is caused by thin-film interference.",cos:[["Shin-Etsu Chemical","Japan","Largest global wafer supplier"],["SUMCO","Japan","Wafer manufacturing"],["Siltronic","Germany","European wafer maker"],["SK Siltron","S. Korea","Wafer manufacturing"]],geo:{all:[["Japan",60,"#BA7517"],["Germany",15,"#639922"],["S. Korea",15,"#1D9E75"],["Other",10,"#888780"]],adv:[["Japan",68,"#BA7517"],["S. Korea",17,"#1D9E75"],["Germany",12,"#639922"],["Other",3,"#888780"]],mat:[["Japan",55,"#BA7517"],["Germany",17,"#639922"],["S. Korea",14,"#1D9E75"],["Other",14,"#888780"]]},note:{all:"Japan controls ~60% of silicon wafer supply. Export controls or natural disasters there ripple across all major chipmakers.",adv:"Advanced node wafers need tighter 300mm specs — Japan's share rises to ~68% as Shin-Etsu and SUMCO dominate the premium segment.",mat:"Mature nodes use a wider range of wafer sizes (200mm still common), slightly reducing Japan's dominance."}},
{name:"Photoresist",sub:"Chemical prep",risk:"critical",rl:"Japan near-monopoly (~90%)",desc:"A photosensitive polymer spun onto the wafer at high RPM to form a uniform 100nm-thick film. When hit by UV/EUV light it either hardens or dissolves (positive/negative resist). Purity requirements are in the parts-per-trillion — trace metals would poison transistors.",cos:[["JSR Corporation","Japan","EUV photoresists"],["Tokyo Ohka Kogyo","Japan","KrF and ArF resists"],["Shin-Etsu Chemical","Japan","ArF immersion resists"],["DuPont","USA","Specialty resist materials"]],geo:{all:[["Japan",88,"#BA7517"],["USA",9,"#378ADD"],["Other",3,"#888780"]],adv:[["Japan",96,"#BA7517"],["USA",3,"#378ADD"],["Other",1,"#888780"]],mat:[["Japan",75,"#BA7517"],["USA",16,"#378ADD"],["Other",9,"#888780"]]},note:{all:"Japan controls ~88% of photoresist production. Japan's 2023 export restrictions on photoresist materials created immediate supply anxiety.",adv:"EUV-specific resist is ~96% Japan — only JSR and TOK have commercial EUV products. Most extreme single-country concentration of any chip input.",mat:"DUV and older processes have slightly more supplier diversity. DuPont has a larger share in mature-node resists."}},
{name:"Photolithography",sub:"Circuit patterning",risk:"critical",rl:"ASML EUV global monopoly",desc:"The EUV machine fires a laser at tin droplets 50,000 times/second to create plasma that emits 13.5nm light. That light is steered by Zeiss mirrors (flattest surfaces ever made) onto the wafer to print circuits. The real machine is the size of a bus and weighs 180 tonnes.",cos:[["ASML","Netherlands","Only EUV machine maker — $150M–$380M/unit"],["Nikon","Japan","DUV systems for mature nodes"],["Canon","Japan","DUV systems for mature nodes"]],geo:{all:[["Netherlands",55,"#7F77DD"],["Japan",45,"#BA7517"]],adv:[["Netherlands",100,"#7F77DD"]],mat:[["Japan",78,"#BA7517"],["Netherlands",22,"#7F77DD"]]},note:{all:"By revenue ASML dominates; by unit volume Japan still ships many DUV machines for mature nodes.",adv:"At sub-5nm EUV is not optional — 100% Netherlands. No other country or company makes EUV machines.",mat:"Mature nodes use DUV (deep UV), where Nikon and Canon compete strongly. Japan's ~78% share reflects decades of installed base."}},
{name:"Etching",sub:"Material removal",risk:"moderate",rl:"US–Japan oligopoly",desc:"Plasma etching uses ionised gas (fluorine, chlorine-based) to selectively remove material with atomic precision. The glowing purple/blue plasma in the chamber is visible through a viewport. The wafer sits on a pedestal and is bombarded by ions from above.",cos:[["Lam Research","USA","Leading plasma etch systems globally"],["Applied Materials","USA","Etch and deposition"],["Tokyo Electron","Japan","Etch and CVD systems"]],geo:{all:[["USA",55,"#378ADD"],["Japan",30,"#BA7517"],["Other",15,"#888780"]],adv:[["USA",62,"#378ADD"],["Japan",30,"#BA7517"],["Other",8,"#888780"]],mat:[["USA",48,"#378ADD"],["Japan",30,"#BA7517"],["China",10,"#D85A30"],["Other",12,"#888780"]]},note:{all:"Lam Research, Applied Materials, and Tokyo Electron control ~85% of the global etch market.",adv:"Atomic layer etch (ALE) required at advanced nodes — Lam's ALE tools are preferred, pushing its share up.",mat:"Chinese domestic etch makers (NAURA, AMEC) are gaining share in mature nodes as Chinese fabs are cut off from advanced tools."}},
{name:"Deposition (CVD/ALD)",sub:"Thin film layers",risk:"moderate",rl:"Specialty gas dependency",desc:"Gases flow into a heated chamber and react on the wafer surface, depositing films one atomic layer at a time (ALD) or in thicker batches (CVD). A single advanced chip has 100+ distinct layers of different materials — oxides, nitrides, metals — deposited in sequence.",cos:[["Applied Materials","USA","CVD market leader"],["Lam Research","USA","ALD and etch"],["Tokyo Electron","Japan","CVD systems"],["ASM International","Netherlands","ALD leader"]],geo:{all:[["USA",50,"#378ADD"],["Japan",28,"#BA7517"],["Netherlands",17,"#7F77DD"],["Other",5,"#888780"]],adv:[["USA",52,"#378ADD"],["Netherlands",24,"#7F77DD"],["Japan",20,"#BA7517"],["Other",4,"#888780"]],mat:[["USA",46,"#378ADD"],["Japan",33,"#BA7517"],["Netherlands",10,"#7F77DD"],["Other",11,"#888780"]]},note:{all:"Specialty gases are a hidden bottleneck. Neon (laser use) spiked 10× after Russia's invasion of Ukraine. China's 2023 gallium/germanium controls targeted deposition precursors.",adv:"ASM International's ALD lead becomes critical — ALD is the only technique that deposits conformal films in sub-5nm structures.",mat:"CVD dominates at mature nodes; Tokyo Electron stronger here, pushing Japan's share higher."}},
{name:"Ion implantation",sub:"Doping",risk:"low",rl:"Stable, US-led supply",desc:"Atoms of boron, phosphorus, or arsenic are stripped of electrons and accelerated down a 3-metre vacuum tube to energies of up to 5 million electron volts — then buried precisely in the silicon crystal. The implant depth is controlled by beam energy to within nanometres.",cos:[["Applied Materials","USA","Ion implant systems leader"],["Axcelis Technologies","USA","Specialist implanter maker"],["Sumitomo Heavy Ind.","Japan","Ion implant equipment"]],geo:{all:[["USA",65,"#378ADD"],["Japan",30,"#BA7517"],["Other",5,"#888780"]],adv:[["USA",65,"#378ADD"],["Japan",30,"#BA7517"],["Other",5,"#888780"]],mat:[["USA",63,"#378ADD"],["Japan",30,"#BA7517"],["Other",7,"#888780"]]},note:{all:"Relatively stable. Applied Materials dominates but ion implantation is less geopolitically sensitive than lithography.",adv:"Equipment is fairly consistent across node types — advanced fabs need more precision but same vendors supply both.",mat:"Mature node demand is high volume; the same US–Japan split applies."}},
{name:"Metrology & inspection",sub:"In-line quality control",risk:"moderate",rl:"US-dominated, KLA concentration",desc:"KLA's machines scan wafers with laser beams, electron beams, and X-rays looking for defects — a particle smaller than a virus can kill a chip. At 3nm, a single 10nm defect in the wrong place ruins a $30,000 wafer. The inspection machines are almost as expensive as the lithography tools.",cos:[["KLA Corporation","USA","Inspection and metrology leader (~50% share)"],["Onto Innovation","USA","Process control systems"],["Hitachi High-Tech","Japan","SEM inspection systems"],["Applied Materials","USA","CMP and metrology"]],geo:{all:[["USA",65,"#378ADD"],["Japan",28,"#BA7517"],["Other",7,"#888780"]],adv:[["USA",72,"#378ADD"],["Japan",25,"#BA7517"],["Other",3,"#888780"]],mat:[["USA",58,"#378ADD"],["Japan",30,"#BA7517"],["Other",12,"#888780"]]},note:{all:"KLA controls ~50% of process control equipment. US export controls limit advanced inspection tool sales to Chinese fabs.",adv:"At advanced nodes, defect tolerances are so tight that KLA's tools are essentially mandatory — their market share rises sharply.",mat:"Mature nodes can use older inspection tools, reducing KLA's dominance and enabling second-hand equipment."}},
{name:"Wafer fabrication",sub:"The fab itself",risk:"critical",rl:"Taiwan geographic concentration",desc:"The cleanroom is filtered to ISO Class 4 (10 particles/m³ vs 35 million/m³ outdoors). Temperature controlled to ±0.01°C. Workers wear full-body 'bunny suits'. It takes 200–1,000+ steps over 3–6 months to complete one wafer lot.",cos:[["TSMC","Taiwan","~92% of sub-5nm chips globally"],["Samsung Foundry","S. Korea","Advanced logic and memory"],["Intel Foundry","USA","Rebuilding advanced capacity"],["GlobalFoundries","USA","Mature specialty nodes"],["SMIC","China","Mature nodes, export-restricted"]],geo:{all:[["Taiwan",65,"#D85A30"],["S. Korea",18,"#1D9E75"],["USA",10,"#378ADD"],["Other",7,"#888780"]],adv:[["Taiwan",92,"#D85A30"],["S. Korea",8,"#1D9E75"]],mat:[["Taiwan",28,"#D85A30"],["China",22,"#888780"],["S. Korea",14,"#1D9E75"],["Japan",10,"#BA7517"],["USA",9,"#378ADD"],["Other",17,"#7F77DD"]]},note:{all:"Taiwan makes ~65% of chips by revenue. CHIPS Act and EU Chips Act aim to diversify — new fabs take a decade to ramp.",adv:"At sub-5nm Taiwan's share hits 92%. Samsung is the only alternative. Intel's 3nm foundry has barely shipped. This is the figure that makes geopolitical analysts lose sleep.",mat:"Mature nodes are far more distributed. China has built massive ≥28nm capacity (SMIC, Hua Hong) in response to advanced chip export controls."}},
{name:"Advanced packaging",sub:"Chip integration",risk:"critical",rl:"CoWoS bottleneck for AI chips",desc:"The die (bare chip) is attached to a substrate using wire bonds or flip-chip bumps — tiny solder balls 100 microns wide. CoWoS (Chip on Wafer on Substrate) stacks multiple dies on an interposer for AI accelerators. The interposer is made on the same equipment as wafer fab.",cos:[["TSMC","Taiwan","CoWoS advanced packaging — AI chip bottleneck"],["ASE Group","Taiwan","Largest OSAT globally"],["Amkor","USA/S. Korea","OSAT services"],["JCET","China","OSAT services"]],geo:{all:[["Taiwan",45,"#D85A30"],["S. Korea",20,"#1D9E75"],["China",15,"#888780"],["Other",20,"#378ADD"]],adv:[["Taiwan",73,"#D85A30"],["S. Korea",18,"#1D9E75"],["Other",9,"#378ADD"]],mat:[["Taiwan",32,"#D85A30"],["China",26,"#888780"],["S. Korea",18,"#1D9E75"],["Other",24,"#378ADD"]]},note:{all:"CoWoS packaging was the #1 constraint on Nvidia H100/B100 supply in 2023–24. TSMC massively expanding CoWoS capacity through 2026.",adv:"For AI chips requiring CoWoS, Taiwan's share jumps to 73%. No one else has commercial CoWoS at scale — TSMC's second chokehold on AI supply.",mat:"Mature packaging is a commodity — China's JCET and others compete on price. Geographic risk here is low."}},
{name:"Test & ship",sub:"Final QC and logistics",risk:"low",rl:"Stable duopoly",desc:"Every chip is plugged into an ATE socket and tested at multiple voltages, temperatures, and clock speeds for up to 90 seconds. Chips that run fastest become server CPUs; slower ones become laptop chips. Identical dies sell at very different prices based solely on test results.",cos:[["Advantest","Japan","ATE systems leader"],["Teradyne","USA","ATE systems"]],geo:{all:[["Japan",45,"#BA7517"],["USA",45,"#378ADD"],["Other",10,"#888780"]],adv:[["Japan",52,"#BA7517"],["USA",42,"#378ADD"],["Other",6,"#888780"]],mat:[["Japan",40,"#BA7517"],["USA",45,"#378ADD"],["Other",15,"#888780"]]},note:{all:"Advantest and Teradyne form a tight duopoly on ATE equipment but supply is generally adequate.",adv:"AI chips need high-speed test equipment — Advantest's newest systems preferred, pushing Japan's share slightly higher.",mat:"Mature chip testing can use older equipment and a broader range of suppliers including smaller regional vendors."}},
];

let sel=0, mode='all';

function setMode(m,btn){
  mode=m;
  document.querySelectorAll('.tog-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('mode-note').textContent=MODES[m];
  renderPanel();
}

function renderSteps(){
  document.getElementById('step-list').innerHTML=steps.map((s,i)=>{
    const r=R[s.risk];
    const isCrit=s.risk==='critical';
    return`<div class="si${i===sel?' active':''}" onclick="selectStep(${i})">
      <div class="snum" style="background:${r.bg};color:${r.tx}">${String(i+1).padStart(2,'0')}</div>
      <div style="flex:1;min-width:0"><div class="sname">${s.name}</div><div class="ssub">${s.sub}</div></div>
      <div class="${isCrit?'sdot-critical':'sdot'}" style="background:${r.dot}"></div>
    </div>`;
  }).join('');
}

function renderPanel(){
  const scrollY=window.scrollY;
  const s=steps[sel]; const r=R[s.risk];
  const gdata=s.geo[mode];
  const total=gdata.reduce((a,g)=>a+g[1],0);
  const stacked=gdata.map(([,pct,col])=>`<div style="width:${((pct/total)*100).toFixed(1)}%;background:${col}"></div>`).join('');
  const legs=gdata.map(([n,,c])=>`<div class="legitem"><div class="legdot" style="background:${c}"></div>${n}</div>`).join('');
  const geoRows=gdata.map(([n,pct,col])=>{
    const allPct=(s.geo.all.find(g=>g[0]===n)||[n,null])[1];
    let badge='';
    if(mode!=='all'&&allPct!=null){const d=pct-allPct;if(Math.abs(d)>=3){const up=d>0;badge=`<span class="chg" style="background:${up?'var(--color-background-danger)':'var(--color-background-success)'};color:${up?'var(--color-text-danger)':'var(--color-text-success)'}">${up?'▲':'▼'}${Math.abs(d)}%</span>`;}}
    return`<div class="grow"><div class="glabel"><span>${n}${badge}</span><span>${pct}%</span></div><div class="gbar"><div class="gfill" style="width:${pct}%;background:${col}"></div></div></div>`;
  }).join('');
  const cos=s.cos.map(([n,reg,role])=>`<div class="cr"><div style="flex:1;min-width:0"><div class="cn">${n}</div><div class="crole">${role}</div></div><div class="ctag">${reg}</div></div>`).join('');
  const noteText=typeof s.note==='object'?s.note[mode]:s.note;
  const noteColor=s.risk==='critical'?'#D85A30':s.risk==='moderate'?'#EF9F27':'#1D9E75';
  document.getElementById('detail-panel').innerHTML=`
    <div class="dph">
      <div class="ill">${ILLS[sel]()}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:15px;font-weight:500;color:var(--color-text-primary)">${s.name}</div>
        <div style="font-size:11px;color:var(--color-text-secondary);margin-top:1px">Step ${sel+1} of ${steps.length} — ${s.sub}</div>
        <div class="rbadge" style="background:${r.bg};color:${r.tx}"><span style="width:6px;height:6px;border-radius:50%;background:${r.dot};display:inline-block;flex-shrink:0"></span>${r.label} — ${s.rl}</div>
        <p class="desc">${s.desc}</p>
      </div>
    </div>
    <div class="dpb">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
        <div><div class="sec">Key companies</div>${cos}</div>
        <div>
          <div class="sec">Geographic concentration</div>
          <div class="stacked">${stacked}</div>
          <div class="legrow">${legs}</div>
          ${geoRows}
          ${mode!=='all'?'<div style="font-size:10px;color:var(--color-text-secondary);margin-top:4px">▲▼ vs all-nodes baseline</div>':''}
        </div>
      </div>
      <div class="bnote" style="border-color:${noteColor};background:${r.bg};color:var(--color-text-secondary)"><span style="font-weight:500;color:var(--color-text-primary)">Supply chain note: </span>${noteText}</div>
    </div>`;
  window.scrollTo(0,scrollY);
}

function selectStep(i){
  sel=i;
  document.querySelectorAll('.si').forEach((el,idx)=>el.classList.toggle('active',idx===i));
  renderPanel();
}
renderSteps(); renderPanel();
</script>
