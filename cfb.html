<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFB — Douglas</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f9f8f5;color:#1a1a18;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.wrap{max-width:600px;width:100%}
nav{margin-bottom:1.5rem}
nav a{font-size:13px;font-weight:500;color:#888780;text-decoration:none}
h1{font-size:13px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:#888780;margin-bottom:2.5rem}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:2rem}
.card{background:#fff;border:0.5px solid #e0dfd8;border-radius:16px;padding:1.75rem 1.5rem;text-decoration:none;color:inherit;transition:border-color 0.15s,transform 0.15s;display:block}
.card:hover{border-color:#aaa;transform:translateY(-2px)}
.card-icon{font-size:28px;color:#888780;margin-bottom:1rem}
.card-title{font-size:17px;font-weight:500;margin-bottom:6px}
.card-desc{font-size:13px;color:#888780;line-height:1.6}
.card-arrow{font-size:12px;color:#bbb;margin-top:1rem;display:block}
@media(max-width:480px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="index.html">← Home</a></nav>
  <h1>Clinical Foundation Block</h1>
  <div class="cards">
    <a class="card" href="clinical-foundation-block.html">
      <div class="card-icon"><i class="ti ti-calendar-stats"></i></div>
      <div class="card-title">Day-by-Day Calendar</div>
      <p class="card-desc">CFB schedule — sessions, bedsides, PBL, dissertation, and revision plan through 4 Oct.</p>
      <span class="card-arrow">Open →</span>
    </a>
    <a class="card" href="lecture-priority-map.html">
      <div class="card-icon"><i class="ti ti-list-numbers"></i></div>
      <div class="card-title">Full Curriculum Map</div>
      <p class="card-desc">Every lecture across the block, tiered S/A/B/C by specialty, split into Clinical Skills and E-Learning.</p>
      <span class="card-arrow">Open →</span>
    </a>
  </div>
</div>
</body>
</html>
