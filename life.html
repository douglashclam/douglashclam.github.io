<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The curriculum — Douglas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<style>
:root {
  --color-background-primary: #ffffff;
  --color-background-secondary: #f5f5f2;
  --color-text-primary: #1a1a1a;
  --color-text-secondary: #6b6b6b;
  --color-text-tertiary: #a0a09a;
  --color-border-primary: #d0d0ca;
  --color-border-secondary: #e0e0da;
  --color-border-tertiary: #eaeae4;
  --border-radius-lg: 12px;
  --border-radius-md: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #eeeee8; min-height: 100vh; color: var(--color-text-primary); }
.kg-wrap { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 3rem; }
nav { display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem }
nav a { display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;color:var(--color-text-tertiary);text-decoration:none;transition:color 0.15s }
nav a:hover { color:var(--color-text-primary) }
nav h1 { font-size:13px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-text-tertiary) }
.kg-panel { background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-lg);overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.07) }
.kg-res-badge { font-size:10px;font-weight:500;padding:2px 7px;border-radius:10px;white-space:nowrap }
.b-book{background:#EEEDFE;color:#3C3489}.b-yt{background:#FCEBEB;color:#791F1F}.b-pod{background:#E1F5EE;color:#085041}.b-web{background:#FAEEDA;color:#633806}.b-app{background:#E6F1FB;color:#0C447C}.b-doc{background:#FAECE7;color:#712B13}.b-act{background:#EAF3DE;color:#3B6D11}.b-ppl{background:#FBEAF0;color:#72243E}
.kg-new-badge { font-size:10px;font-weight:500;padding:2px 8px;border-radius:10px;background:#EEEDFE;color:#3C3489;margin-left:6px;vertical-align:middle }
.ov-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;padding:1.25rem 1.5rem;background:var(--color-background-secondary) }
.ov-card { background:var(--color-background-primary);padding:1.25rem 1.5rem;cursor:pointer;transition:all 0.15s;border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-secondary);box-shadow:0 1px 4px rgba(0,0,0,0.06);text-decoration:none;display:block;color:inherit }
.ov-card:hover { box-shadow:0 4px 16px rgba(0,0,0,0.1);border-color:var(--color-border-primary);transform:translateY(-1px) }
.ov-card-top { display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;gap:8px }
.ov-card-title { font-size:15px;font-weight:600;color:var(--color-text-primary);display:flex;align-items:center;gap:8px }
.ov-card-title i { font-size:16px;color:var(--color-text-secondary) }
.ov-card-desc { font-size:13px;color:var(--color-text-secondary);line-height:1.55;margin:0 0 10px }
.ov-card-footer { display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap }
.ov-dots { display:flex;gap:2px;flex-shrink:0 }
.ov-dot { width:6px;height:6px;border-radius:50%;background:var(--color-border-tertiary) }
.ov-dot.on-high{background:#1D9E75}.ov-dot.on-mid{background:#BA7517}.ov-dot.on-low{background:#E24B4A}
.ov-header { padding:1.25rem 1.5rem;border-bottom:0.5px solid var(--color-border-tertiary) }
.ov-header-top { display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;flex-wrap:wrap;gap:8px }
.ov-header-title { font-size:18px;font-weight:600;color:var(--color-text-primary);margin:0 }
.ov-controls { display:flex;align-items:center;gap:8px }
.ov-legend { display:flex;align-items:center;gap:12px }
.ov-legend-item { display:flex;align-items:center;gap:5px;font-size:11px;color:var(--color-text-secondary) }
.ov-legend-dot { width:8px;height:8px;border-radius:50% }
.sort-btn { font-size:12px;font-weight:500;padding:4px 12px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:5px;font-family:'Inter',sans-serif }
.sort-btn.active { background:var(--color-background-secondary);color:var(--color-text-primary);border-color:var(--color-border-primary) }
.priority-badge { display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:600;flex-shrink:0 }
.p-high{background:#E1F5EE;color:#085041}.p-mid{background:#FAEEDA;color:#633806}.p-low{background:#F1EFE8;color:#5F5E5A}
</style>

<div class="kg-wrap">
  <nav>
    <a href="index.html"><i class="ti ti-arrow-left"></i> Home</a>
    <h1>The curriculum</h1>
    <span></span>
  </nav>
  <div class="kg-panel">
    <div class="ov-header">
      <div class="ov-header-top">
        <p class="ov-header-title">The 21-year-old curriculum</p>
        <div class="ov-controls">
          <button class="sort-btn active" id="btn-priority" onclick="setSort('priority')"><i class="ti ti-sort-ascending-numbers" style="font-size:13px"></i>Priority</button>
          <button class="sort-btn" id="btn-alpha" onclick="setSort('alpha')"><i class="ti ti-sort-ascending-letters" style="font-size:13px"></i>A–Z</button>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:16px;margin-top:6px;flex-wrap:wrap">
        <p style="font-size:13px;color:var(--color-text-secondary);margin:0">13 areas worth developing. Click any card to explore in depth.</p>
        <div class="ov-legend">
          <div class="ov-legend-item"><div class="ov-legend-dot" style="background:#1D9E75"></div>Strong AI</div>
          <div class="ov-legend-item"><div class="ov-legend-dot" style="background:#BA7517"></div>Moderate</div>
          <div class="ov-legend-item"><div class="ov-legend-dot" style="background:#E24B4A"></div>Weak AI</div>
        </div>
      </div>
    </div>
    <div class="ov-grid" id="grid"></div>
  </div>
</div>

<script>
const DATA=[
  {id:"health",icon:"ti-heart-rate-monitor",label:"Health",priority:1,priorityCls:"p-high",overviewDesc:"Sleep, exercise, diet. Small consistent inputs now, massive long-term outputs. The habits you build this decade are the ones you keep.",bestFormat:{label:"Podcasts + gym",cls:"b-pod"},ai:{level:"high",dots:4}},
  {id:"thinking",icon:"ti-brain",label:"How to think",priority:2,priorityCls:"p-high",overviewDesc:"Cognitive biases, first principles reasoning, Bayesian updating, steelmanning. The operating system under everything else.",bestFormat:{label:"Books",cls:"b-book"},ai:{level:"high",dots:5}},
  {id:"money",icon:"ti-coin",label:"Money",priority:3,priorityCls:"p-high",overviewDesc:"Compound interest, ISAs, index funds, debt hierarchy. The boring stuff that makes the biggest difference.",bestFormat:{label:"Doing it + websites",cls:"b-act"},ai:{level:"mid",dots:3}},
  {id:"psychology",icon:"ti-mood-smile",label:"Your psychology",priority:4,priorityCls:"p-high",overviewDesc:"Why you react the way you do. Attachment theory, cognitive distortions, the gap between what you want and what you think you should want.",bestFormat:{label:"Books + therapy",cls:"b-book"},ai:{level:"mid",dots:2}},
  {id:"medicine",icon:"ti-stethoscope",label:"Medical career",priority:5,priorityCls:"p-high",overviewDesc:"Clinical reasoning, specialty landscape, academic vs clinical track, NHS hierarchy, emotional resilience. The human side of being a doctor.",bestFormat:{label:"People + doing it",cls:"b-ppl"},ai:{level:"high",dots:4}},
  {id:"communication",icon:"ti-message-2",label:"Communication",isNew:true,priority:6,priorityCls:"p-high",overviewDesc:"Writing clearly, speaking persuasively, presenting confidently. The skill that amplifies every other skill you have.",bestFormat:{label:"Doing it",cls:"b-act"},ai:{level:"high",dots:5}},
  {id:"practical",icon:"ti-tool",label:"Practical life",isNew:true,priority:7,priorityCls:"p-mid",overviewDesc:"Cooking, insurance, tax, contracts, credit score, NHS admin. The unsexy stuff that quietly determines quality of life.",bestFormat:{label:"Doing it + websites",cls:"b-act"},ai:{level:"mid",dots:3}},
  {id:"relationships",icon:"ti-users",label:"Relationships",priority:8,priorityCls:"p-mid",overviewDesc:"Quality of close relationships is the single biggest predictor of life satisfaction. More than money, status, or achievement.",bestFormat:{label:"Lived experience",cls:"b-ppl"},ai:{level:"low",dots:1}},
  {id:"wrongness",icon:"ti-refresh",label:"Being wrong",priority:9,priorityCls:"p-mid",overviewDesc:"Separating identity from opinion. Steelmanning. Post-mortems. Epistemic humility vs epistemic cowardice.",bestFormat:{label:"Books",cls:"b-book"},ai:{level:"high",dots:5}},
  {id:"career",icon:"ti-briefcase",label:"Career capital",priority:10,priorityCls:"p-mid",overviewDesc:"Rare and valuable skills beat passion. Deep work beats shallow work. One senior mentor conversation beats three career books.",bestFormat:{label:"People first",cls:"b-ppl"},ai:{level:"mid",dots:3}},
  {id:"history",icon:"ti-clock-hour-4",label:"History",priority:11,priorityCls:"p-low",overviewDesc:"Empires, revolutions, economic cycles, technology disruption. The present makes no sense without it.",bestFormat:{label:"Books + podcasts",cls:"b-book"},ai:{level:"high",dots:4}},
  {id:"geopolitics",icon:"ti-world",label:"Geopolitics",priority:12,priorityCls:"p-low",overviewDesc:"US-China competition, geography as destiny, trade as a weapon, demographic decline. Why nations do what they do.",bestFormat:{label:"Podcasts + journalism",cls:"b-pod"},ai:{level:"high",dots:5}},
  {id:"power",icon:"ti-building-bank",label:"How power works",priority:13,priorityCls:"p-low",overviewDesc:"Incentives, media ownership, regulatory capture. How the world actually runs vs how you were taught it does.",bestFormat:{label:"Documentaries",cls:"b-doc"},ai:{level:"high",dots:4}}
];

const AI_COLORS={high:"on-high",mid:"on-mid",low:"on-low"};
let sortMode="priority";

function tierLabel(cls){
  if(cls==="p-high")return{text:"Do now",color:"#085041",bg:"#E1F5EE"};
  if(cls==="p-mid")return{text:"This year",color:"#633806",bg:"#FAEEDA"};
  return{text:"Build gradually",color:"#5F5E5A",bg:"#F1EFE8"};
}

function render(){
  const sorted=sortMode==="priority"?[...DATA].sort((a,b)=>a.priority-b.priority):[...DATA].sort((a,b)=>a.label.localeCompare(b.label));
  document.getElementById("grid").innerHTML=sorted.map(d=>{
    const t=tierLabel(d.priorityCls);
    const dots=Array.from({length:5},(_,i)=>`<div class="ov-dot${i<d.ai.dots?' '+AI_COLORS[d.ai.level]:''}"></div>`).join("");
    return`<a class="ov-card" href="area.html?id=${d.id}">
      <div class="ov-card-top">
        <div class="ov-card-title"><span class="priority-badge ${d.priorityCls}">${d.priority}</span><i class="ti ${d.icon}"></i>${d.label}${d.isNew?'<span class="kg-new-badge">New</span>':''}</div>
        <div class="ov-dots">${dots}</div>
      </div>
      <p class="ov-card-desc">${d.overviewDesc}</p>
      <div class="ov-card-footer">
        <span class="kg-res-badge ${d.bestFormat.cls}">${d.bestFormat.label}</span>
        <span style="font-size:11px;font-weight:500;padding:2px 10px;border-radius:10px;background:${t.bg};color:${t.color}">${t.text}</span>
      </div>
    </a>`;
  }).join("");
}

function setSort(mode){
  sortMode=mode;
  document.getElementById("btn-priority").classList.toggle("active",mode==="priority");
  document.getElementById("btn-alpha").classList.toggle("active",mode==="alpha");
  render();
}

render();
</script>
</body>
</html>
